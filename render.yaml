services:
  - type: web
    name: injury-risk-api
    runtime: python
    rootDir: api
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        value: your-anthropic-key-here
    autoDeploy: true