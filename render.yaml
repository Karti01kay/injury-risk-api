services:
  - type: web
    name: injury-risk-api
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: pip install -r api/requirements.txt
    startCommand: python start.py
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        value: your-anthropic-key-here
    autoDeploy: true